kind: pipeline
type: docker
name: build_and_push

steps:
  - name: build
    image: plugins/docker
    settings:
      repo: gitea.sanjuandediosmalaga.es/${DRONE_REPO}
      registry: gitea.sanjuandediosmalaga.es

      tags:
        - latest
        - ${DRONE_BRANCH}
        - ${DRONE_BRANCH}-${DRONE_COMMIT_SHA:0:8}

      username:
        from_secret: gitea_user
      password:
        from_secret: gitea_pass

      dockerfile: Dockerfile
      context: .

  - name: trigger_coolify
    image: curlimages/curl
    environment:
      COOLIFY_URL:
        from_secret: coolify_url
      COOLIFY_KEY:
        from_secret: coolify_key
    commands:
      - 'curl $COOLIFY_URL --header "Authorization: Bearer $COOLIFY_KEY"'
    depends_on:
      - build
